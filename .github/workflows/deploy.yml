name: Build & Test (Ready for Vercel)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22.x"

jobs:
  # 빌드 및 타입 검사
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run verify:dependency-audit

      - name: Type check & Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: build-output
          path: |
            .next/
            public/deployment-provenance.json
          include-hidden-files: true
          retention-days: 1

      - name: Upload dependency audit evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dependency-audit-policy
          path: output/playwright/dependency-audit-policy.json
          retention-days: 7

  # 타입 검사 + 단위 테스트 (test:adapters — 카운트는 tests/ 실측 기준)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:adapters

      - name: Integrity contract tests
        run: |
          npm run test:system-stress-contract
          npm run test:deployment-provenance-contract
          npm run test:release-closeout-contract
          npm run test:portfolio-claims-contract
          npm run test:ci-workflow-contract
          npm run test:dependency-audit-contract

      - name: Portfolio claim audit
        run: npm run verify:portfolio-claims

      - name: CI workflow audit
        run: npm run verify:ci-workflow

      - name: Upload portfolio claim audit
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: portfolio-claim-audit
          path: output/playwright/portfolio-claim-audit.json
          retention-days: 7

      - name: Upload CI workflow audit
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-workflow-audit
          path: output/playwright/ci-workflow-contract.json
          retention-days: 7

  # E2E 렌더링 회귀 가드 (Playwright, 프로덕션 빌드 기준)
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Build (E2E runs against standalone runtime)
        run: npm run build

      - name: Local production-build stress
        run: npm run ntl:system-stress

      - name: Upload system stress evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: local-system-stress
          path: output/playwright/local-system-stress-smoke.json
          retention-days: 7

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
