name: Build & Test (Ready for Vercel)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22.x"
  LOAD_TEST_THRESHOLD: 90

jobs:
  # 빌드 및 타입 검사
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate || true

      - name: Type check & Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: .next/
          include-hidden-files: true
          retention-days: 1

  # 타입 검사 + 단위 테스트 (순수 함수 282 스펙)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:adapters

  # E2E 렌더링 회귀 가드 (Playwright, 프로덕션 빌드 기준)
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Build (E2E runs against next start)
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 로드 테스트
  load-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Agent Load Test
        id: loadtest
        run: |
          npx tsx tests/load/agentLoadTest.ts > loadtest_output.txt 2>&1 || true
          cat loadtest_output.txt

          # 성공률 추출
          SUCCESS_RATE=$(grep -o 'Success Rate: *[0-9]*' loadtest_output.txt | grep -o '[0-9]*' || echo "0")
          echo "success_rate=$SUCCESS_RATE" >> $GITHUB_OUTPUT

          # 임계값 확인
          if [ "$SUCCESS_RATE" -lt "${{ env.LOAD_TEST_THRESHOLD }}" ]; then
            echo "❌ Load test failed: ${SUCCESS_RATE}% < ${LOAD_TEST_THRESHOLD}%"
            exit 1
          else
            echo "✅ Load test passed: ${SUCCESS_RATE}% >= ${LOAD_TEST_THRESHOLD}%"
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: load-test-results
          path: tests/load/results_*.json
          retention-days: 7
