name: Build & Test (Ready for Vercel)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'
  LOAD_TEST_THRESHOLD: 90

jobs:
  # 빌드 및 타입 검사
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check & Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 1

  # 로드 테스트
  load-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Agent Load Test
        id: loadtest
        run: |
          npx tsx tests/load/agentLoadTest.ts > loadtest_output.txt 2>&1 || true
          cat loadtest_output.txt
          
          # 성공률 추출
          SUCCESS_RATE=$(grep -oP 'Success Rate:\s+\K\d+' loadtest_output.txt || echo "0")
          echo "success_rate=$SUCCESS_RATE" >> $GITHUB_OUTPUT
          
          # 임계값 확인
          if [ "$SUCCESS_RATE" -lt "${{ env.LOAD_TEST_THRESHOLD }}" ]; then
            echo "❌ Load test failed: ${SUCCESS_RATE}% < ${LOAD_TEST_THRESHOLD}%"
            exit 1
          else
            echo "✅ Load test passed: ${SUCCESS_RATE}% >= ${LOAD_TEST_THRESHOLD}%"
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: tests/load/results_*.json
          retention-days: 7
